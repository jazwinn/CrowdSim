name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs: on main, let runs finish so the vcpkg binary
  # cache gets saved (the first dependency build takes ~40 minutes).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match "builtin-baseline" in vcpkg.json.
  VCPKG_COMMIT: 9a5dfef5d1a0438a7d24856a85bd60f309d355e9

jobs:
  lint:
    name: Lint (global state, formatting)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the global-state checker
        run: python tools/test_check_global_state.py
      - name: No singletons / mutable globals / mutable statics
        run: python tools/check_global_state.py
      # Pinned: clang-format output differs between major versions, so CI and local
      # formatting must use the same one (pip install clang-format==22.1.4).
      - name: Install clang-format
        run: pip install clang-format==22.1.4
      - name: clang-format
        run: |
          clang-format --version
          find core reflect geometry snapshot sim physics assets commands animation script mcp metrics platform render ui app tests bench -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
            preset: linux
            triplet: x64-linux
            gui_smoke: xvfb-run -a -s "-screen 0 1280x720x24" crowdsim --frames 30 --renderer opengl --log-level warn
          - name: macOS (Apple Silicon)
            os: macos-15
            preset: macos
            triplet: arm64-osx
            gui_smoke: crowdsim --frames 30 --renderer noop --log-level warn
          - name: Windows (MSVC)
            os: windows-latest
            preset: windows-ninja
            triplet: x64-windows-static-md
            gui_smoke: crowdsim --frames 30 --renderer noop --log-level warn
    runs-on: ${{ matrix.os }}
    env:
      # Not VCPKG_ROOT: msvc-dev-cmd exports VCPKG_ROOT pointing at Visual Studio's
      # bundled vcpkg. We pass our pinned clone explicitly to the configure step.
      CS_VCPKG_DIR: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool pkg-config xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libgl1-mesa-dri mesa-utils libdbus-1-dev libltdl-dev clang-tidy

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja autoconf automake libtool

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$CS_VCPKG_DIR"
          git -C "$CS_VCPKG_DIR" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "$(cygpath -w "$CS_VCPKG_DIR")\\bootstrap-vcpkg.bat" -disableMetrics
          else
            "$CS_VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        shell: bash
        run: VCPKG_ROOT="$CS_VCPKG_DIR" cmake --preset ${{ matrix.preset }}

      # Save as soon as dependencies are built, so later failures don't lose them.
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config Release --parallel

      - name: Test (non-GUI)
        run: ctest --test-dir build/${{ matrix.preset }} -C Release -LE gui --output-on-failure

      - name: GUI smoke run
        shell: bash
        working-directory: build/${{ matrix.preset }}/bin/Release
        run: PATH="$PWD:$PATH" ${{ matrix.gui_smoke }}

      - name: clang-tidy (global variables)
        shell: bash
        run: |
          find core geometry sim physics assets commands animation script mcp metrics platform render ui app -name '*.cpp' -print0 \
            | xargs -0 -n 8 clang-tidy -p build/${{ matrix.preset }} --quiet \
                -checks='-*,cppcoreguidelines-avoid-non-const-global-variables' \
                -warnings-as-errors='cppcoreguidelines-avoid-non-const-global-variables' \
                --extra-arg=-Wno-unknown-warning-option --extra-arg=-Wno-unused-command-line-argument
